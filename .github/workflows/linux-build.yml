name: Build Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20", "22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test Linux image
        env:
          DOCKER_BUILDKIT: "1"
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          image="jpegview-linux-build:ubuntu${UBUNTU_VERSION}"
          output_dir="$RUNNER_TEMP/jpegview-linux-ci-ubuntu${UBUNTU_VERSION}"
          mkdir -p "$output_dir"

          docker build \
            --file "linux/Dockerfile.ubuntu${UBUNTU_VERSION}" \
            --tag "$image" \
            .

          docker run --rm -v "$output_dir:/out" "$image" appimage ci
          docker run --rm -v "$output_dir:/out" "$image" binary

          (
            cd "$output_dir"
            sha256sum JPEGView-Linux-ci-x86_64.AppImage jpegview-linux > SHA256SUMS
          )

      - name: Upload Ubuntu ${{ matrix.ubuntu }} build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jpegview-linux-ubuntu${{ matrix.ubuntu }}-x86_64
          path: |
            ${{ runner.temp }}/jpegview-linux-ci-ubuntu${{ matrix.ubuntu }}/JPEGView-Linux-ci-x86_64.AppImage
            ${{ runner.temp }}/jpegview-linux-ci-ubuntu${{ matrix.ubuntu }}/jpegview-linux
            ${{ runner.temp }}/jpegview-linux-ci-ubuntu${{ matrix.ubuntu }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  shell-check:
    name: Packaging shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: make -C linux test-shell

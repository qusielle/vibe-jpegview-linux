name: Build Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20", "22", "24", "26"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and test Linux image
        env:
          DOCKER_BUILDKIT: "1"
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          image="jpegview-linux-build:ubuntu${UBUNTU_VERSION}"
          output_dir="$RUNNER_TEMP/jpegview-linux-ci-ubuntu${UBUNTU_VERSION}"
          artifact_dir="$RUNNER_TEMP/jpegview-linux-ci-artifacts-ubuntu${UBUNTU_VERSION}"
          app_version="$(sh ./linux/version.sh)"
          appimage_name="JPEGView-${app_version}-x86_64.AppImage"
          binary_bundle_name="jpegview-linux-${app_version}-ubuntu${UBUNTU_VERSION}-x86_64-with-archive-plugins.tar.gz"
          docker_build_attempts=3
          if [ "$UBUNTU_VERSION" = "20" ]; then
            docker_build_attempts=10
          fi
          mkdir -p "$output_dir" "$artifact_dir"

          JPEGVIEW_RETRY_ATTEMPTS="$docker_build_attempts" \
            sh ./linux/retry-command.sh -- docker build \
            --file "linux/Dockerfile.ubuntu${UBUNTU_VERSION}" \
            --tag "$image" \
            .

          docker run --rm -v "$output_dir:/out" "$image" appimage "$app_version"
          case "$appimage_name" in
            *Linux*) echo "AppImage asset name must not contain Linux: $appimage_name" >&2; exit 1 ;;
          esac
          test -f "$output_dir/$appimage_name"
          docker run --rm -v "$output_dir:/out" "$image" binary "$app_version"
          binary_version=$(docker run --rm -v "$output_dir:/out" \
            --entrypoint /out/jpegview-linux "$image" --version)
          test "$binary_version" = "JPEGView Linux $app_version"
          test -f "$output_dir/lib/jpegview-linux/7z.so"
          test -f "$output_dir/lib/jpegview-linux/librar_backend.so"
          test -f "$output_dir/share/doc/jpegview-linux/7zip-24.09-notice.txt"
          test -f "$output_dir/share/doc/jpegview-linux/7zip-24.09-source.tar.gz"
          test -f "$output_dir/share/doc/jpegview-linux/rar-backend-notice.txt"
          test -f "$output_dir/share/doc/jpegview-linux/jpegview-rar-backend-source.tar.gz"
          test -f "$output_dir/share/doc/jpegview-linux/rars-afc60e4-source.tar.gz"
          test -f "$output_dir/share/doc/jpegview-linux/rars-Apache-2.0.txt"
          test -f "$output_dir/share/doc/jpegview-linux/jpegview-rar-backend-GPL-2.0.txt"
          tar -czf "$output_dir/$binary_bundle_name" -C "$output_dir" \
            jpegview-linux lib/jpegview-linux/7z.so lib/jpegview-linux/librar_backend.so \
            share/doc/jpegview-linux/7zip-24.09-notice.txt \
            share/doc/jpegview-linux/7zip-24.09-License.txt \
            share/doc/jpegview-linux/7zip-24.09-LGPL-2.1.txt \
            share/doc/jpegview-linux/7zip-24.09-source.tar.gz \
            share/doc/jpegview-linux/rar-backend-notice.txt \
            share/doc/jpegview-linux/jpegview-rar-backend-source.tar.gz \
            share/doc/jpegview-linux/rars-afc60e4-source.tar.gz \
            share/doc/jpegview-linux/rars-Apache-2.0.txt \
            share/doc/jpegview-linux/jpegview-rar-backend-GPL-2.0.txt

          if [ "$UBUNTU_VERSION" = "24" ] || [ "$UBUNTU_VERSION" = "26" ]; then
            deb_image="jpegview-linux-deb-build:ubuntu${UBUNTU_VERSION}"
            deb_version="$app_version"
            deb_name="jpegview-linux_${deb_version}_ubuntu${UBUNTU_VERSION}_amd64.deb"

            sh ./linux/retry-command.sh -- docker build \
              --file "linux/Dockerfile.deb.ubuntu${UBUNTU_VERSION}" \
              --tag "$deb_image" \
              .
            docker run --rm -v "$output_dir:/out" "$deb_image" \
              deb "$deb_version" "$UBUNTU_VERSION"
            test "$(dpkg-deb -f "$output_dir/$deb_name" Version)" = "$app_version"

            docker run --rm \
              --env DEB_NAME="$deb_name" \
              --env APP_VERSION="$app_version" \
              --volume "$output_dir:/out" \
              "ubuntu:${UBUNTU_VERSION}.04" \
              bash -euc '
                apt-get update
                apt-get install --yes --no-install-recommends "/out/$DEB_NAME"
                jpegview-linux --help >/dev/null
                test "$(jpegview-linux --version)" = "JPEGView Linux $APP_VERSION"
              '

            (
              cd "$output_dir"
              sha256sum \
                "$appimage_name" \
                jpegview-linux \
                "$binary_bundle_name" \
                "$deb_name" > SHA256SUMS
            )
            cp "$output_dir/$deb_name" "$artifact_dir/"
          else
            (
              cd "$output_dir"
              sha256sum "$appimage_name" jpegview-linux "$binary_bundle_name" > SHA256SUMS
            )
          fi

          cp \
            "$output_dir/$appimage_name" \
            "$output_dir/jpegview-linux" \
            "$output_dir/$binary_bundle_name" \
            "$output_dir/SHA256SUMS" \
            "$artifact_dir/"

      - name: Upload Ubuntu ${{ matrix.ubuntu }} build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jpegview-linux-ubuntu${{ matrix.ubuntu }}-x86_64
          path: ${{ runner.temp }}/jpegview-linux-ci-artifacts-ubuntu${{ matrix.ubuntu }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  shell-check:
    name: Packaging shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: make -C linux test-shell

name: Release Linux artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Ubuntu ${{ matrix.ubuntu }} (x86_64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20", "22", "24"]
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build container
        env:
          DOCKER_BUILDKIT: "1"
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: >-
          docker build
          --file "linux/Dockerfile.ubuntu${UBUNTU_VERSION}"
          --tag "jpegview-linux-build:ubuntu${UBUNTU_VERSION}"
          .

      - name: Build and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          safe_version=${RELEASE_TAG//[^a-zA-Z0-9._+-]/-}
          image="jpegview-linux-build:ubuntu${UBUNTU_VERSION}"
          output_dir="$RUNNER_TEMP/jpegview-linux-release"
          appimage_name="JPEGView-Linux-${safe_version}-ubuntu${UBUNTU_VERSION}-x86_64.AppImage"
          binary_name="jpegview-linux-${safe_version}-ubuntu${UBUNTU_VERSION}-x86_64"
          checksums_name="SHA256SUMS-ubuntu${UBUNTU_VERSION}.txt"

          mkdir -p "$output_dir"

          docker run --rm -v "$output_dir:/out" "$image" appimage "$safe_version"
          mv "$output_dir/JPEGView-Linux-${safe_version}-x86_64.AppImage" "$output_dir/$appimage_name"

          docker run --rm -v "$output_dir:/out" "$image" binary
          mv "$output_dir/jpegview-linux" "$output_dir/$binary_name"

          (
            cd "$output_dir"
            sha256sum "$appimage_name" "$binary_name" > "$checksums_name"
          )

          gh release upload "$RELEASE_TAG" \
            "$output_dir/$appimage_name" \
            "$output_dir/$binary_name" \
            "$output_dir/$checksums_name" \
            --clobber

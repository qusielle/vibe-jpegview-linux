name: Release Linux artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Ubuntu ${{ matrix.ubuntu }} (x86_64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20", "22", "24"]
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build container
        env:
          DOCKER_BUILDKIT: "1"
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: >-
          docker build
          --file "linux/Dockerfile.ubuntu${UBUNTU_VERSION}"
          --tag "jpegview-linux-build:ubuntu${UBUNTU_VERSION}"
          .

      - name: Build and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
          OUTPUT_DIR: ${{ runner.temp }}/jpegview-linux-release
        run: bash linux/release-assets.sh
